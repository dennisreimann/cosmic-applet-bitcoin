[package]
name = "cosmic-applet-bitcoin"
version = "1.3.2"
edition = "2021"
description = "COSMIC panel applet showing configurable Home Assistant entities"

[dependencies]
# Revision gepinnt: die Applet-Patterns (Popup, Autosize) sind gegen
# genau diese libcosmic-Revision verifiziert; cargo update darf sie nicht
# verschieben (siehe AGENTS.md).
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "95236a944bfd51c63a2fc65fe50a592c47168d40", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
# rustls mit System-CA-Store: Instanzen mit eigener CA (z. B. Start9)
# müssen vertraut werden können — webpki-roots reicht dafür nicht.
# (reqwest 0.13: „rustls“ nutzt rustls-platform-verifier, liest also
# den System-Trust-Store; das frühere „rustls-tls-native-roots“ ist weg.)
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
toml = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
i18n-embed = { version = "0.16.0", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8.11.0"

# Upstream hat das Crate in dbus-settings-bindings main zu
# „cosmic-settings-daemon-zbus“ umbenannt; der gepinnte libcosmic-Rev
# braucht noch den alten Namen „cosmic-settings-daemon“ (zbus 5).
# Der Pfad-Patch auf den Vendor-Snapshot (siehe vendor/cosmic-settings-
# daemon/README) hält `cargo update` funktionsfähig; die übrigen
# Bindings dieses Repos aktualisieren sich normal.
[patch.'https://github.com/pop-os/dbus-settings-bindings']
cosmic-settings-daemon = { path = "vendor/cosmic-settings-daemon" }
switcheroo-control = { path = "vendor/switcheroo-control" }

[dev-dependencies]
httpmock = "0.9"
tempfile = "3"

[profile.dev]
opt-level = 1

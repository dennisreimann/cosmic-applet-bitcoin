[package]
name = "cosmic-applet-bitcoin"
version = "1.1.0"
edition = "2021"
description = "COSMIC panel applet showing configurable Home Assistant entities"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
# rustls mit System-CA-Store: Instanzen mit eigener CA (z. B. Start9)
# müssen vertraut werden können — webpki-roots reicht dafür nicht.
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
i18n-embed = { version = "0.16.0", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8.11.0"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[profile.dev]
opt-level = 1

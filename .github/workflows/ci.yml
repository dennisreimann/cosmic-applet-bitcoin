name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            llvm \
            clang \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Install script packaging
        run: |
          mkdir -p dist
          cp target/release/cosmic-applet-bitcoin dist/
          cp data/net.d11n.CosmicBitcoin.desktop dist/
          cp install.sh dist/
          chmod +x dist/install.sh
          tar -C dist -czf cosmic-applet-bitcoin-linux-x86_64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cosmic-applet-bitcoin-linux-x86_64
          path: cosmic-applet-bitcoin-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: cosmic-applet-bitcoin-linux-x86_64
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: cosmic-applet-bitcoin ${{ github.ref_name }}
          body: |
            Native COSMIC panel applet showing configurable Bitcoin entities.

            ## Install
            ```
            tar -xzf cosmic-applet-bitcoin-linux-x86_64.tar.gz
            ./install.sh
            ```
            Then add the "Bitcoin" applet in COSMIC Panel settings.
          files: artifacts/cosmic-applet-bitcoin-linux-x86_64.tar.gz
          draft: false

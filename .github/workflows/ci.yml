name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            llvm \
            clang \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Install script packaging
        run: |
          mkdir -p dist/assets
          cp target/release/cosmic-applet-bitcoin dist/
          cp target/release/cosmic-applet-bitcoin-settings dist/
          cp assets/bitcoin.svg dist/assets/
          cp data/net.d11n.CosmicBitcoin.desktop dist/
          cp install.sh dist/
          chmod +x dist/install.sh
          tar -C dist -czf cosmic-applet-bitcoin-linux-x86_64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cosmic-applet-bitcoin-linux-x86_64
          path: cosmic-applet-bitcoin-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: cosmic-applet-bitcoin-linux-x86_64
          path: artifacts

      # Release notes: nur der Abschnitt des aktuellen Tags aus der
      # CHANGELOG.md (## [X.Y.Z] … bis zur nächsten Versionssektion).
      - name: Extract release notes from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && (/^## \[/ || /^\[.*\]: /) { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Kein CHANGELOG-Abschnitt für $VERSION gefunden" >&2
            exit 1
          fi
          cat >> release-notes.md << 'FOOTER'

          ## Install
          ```
          tar -xzf cosmic-applet-bitcoin-linux-x86_64.tar.gz
          ./install.sh
          ```
          Then add the "Bitcoin" applet in COSMIC Panel settings.
          FOOTER
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: cosmic-applet-bitcoin ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/cosmic-applet-bitcoin-linux-x86_64.tar.gz
          draft: false
